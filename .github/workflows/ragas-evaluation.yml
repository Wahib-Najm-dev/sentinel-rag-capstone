name: SentinelRAG RAGAS Evaluation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "q01 pilot or complete frozen 20-question evaluation"
        required: true
        type: choice
        options:
          - q01
          - all20
        default: q01
      confirm:
        description: "Type APPROVE-Q01-13 or APPROVE-ALL20-260 exactly"
        required: true
        type: string
      resume_run_id:
        description: "Optional previous Actions run ID whose ragas-evaluation-state artifact should be resumed"
        required: false
        type: string
  push:
    branches:
      - eval/ragas-preparation
    paths:
      - data/eval/ragas_workflow_trigger.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sentinelrag-ragas-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RAGAS_DO_NOT_TRACK: "true"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ragas-github.txt

      - name: Resolve scope and explicit authorization
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          MANUAL_CONFIRM: ${{ inputs.confirm }}
          MANUAL_RESUME: ${{ inputs.resume_run_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          out=pathlib.Path(os.environ["GITHUB_OUTPUT"])
          if os.environ["EVENT_NAME"]=="push":
              value=json.loads(pathlib.Path("data/eval/ragas_workflow_trigger.json").read_text())
              scope=value["scope"]; confirm=value["confirm"]; resume=str(value.get("resume_run_id") or "")
          else:
              scope=os.environ.get("MANUAL_SCOPE","")
              confirm=os.environ.get("MANUAL_CONFIRM","")
              resume=os.environ.get("MANUAL_RESUME","")
          expected={"q01":"APPROVE-Q01-13","all20":"APPROVE-ALL20-260"}
          if scope not in expected or confirm!=expected[scope]:
              raise SystemExit("Explicit evaluation authorization is missing or mismatched.")
          with out.open("a") as f:
              f.write(f"scope={scope}\nconfirm={confirm}\nresume_run_id={resume}\n")
          print("AUTHORIZED_SCOPE="+scope)
          PY

      - name: Require Cohere secret before any provider call
        shell: bash
        run: |
          if [ -z "$COHERE_API_KEY" ]; then
            echo "Missing repository Actions secret: COHERE_API_KEY"
            exit 2
          fi
          echo "COHERE_SECRET_PRESENT=YES"

      - name: Restore durable state from an earlier run
        if: steps.gate.outputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ steps.gate.outputs.resume_run_id }}
        run: |
          mkdir -p .resume .ragas-state
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" -n ragas-evaluation-state -D .resume
          cp -a .resume/. .ragas-state/
          echo "RESUMED_FROM_RUN=$RESUME_RUN_ID"

      - name: Install isolated evaluation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ragas-github.txt
          python -m pip check

      - name: Rebuild and verify approved reference packet offline
        run: |
          rm -rf .cache/ragas-review
          python scripts/audit_ragas_references.py
          python - <<'PY'
          import json, pathlib
          packet=json.loads(pathlib.Path(".cache/ragas-review/ragas20_reference_candidates.json").read_text())
          approval=json.loads(pathlib.Path("data/eval/ragas20_reference_approval.json").read_text())
          assert packet["reference_set_sha256"]==approval["reference_set_sha256"]=="5b28da0ae185ca6bb2c7efca6b17e49cad24c37fb8695445ea12eb6807dcdf39"
          assert packet["required_metrics"]==["Faithfulness","Answer Relevancy","Context Precision","Context Recall"]
          print("REFERENCE_APPROVAL_AND_FOUR_METRICS=PASSED")
          PY

      - name: Run frozen RAGAS evaluation
        id: evaluate
        shell: bash
        run: |
          set +e
          python scripts/run_ragas_github.py             --scope "${{ steps.gate.outputs.scope }}"             --confirm "${{ steps.gate.outputs.confirm }}"             --state-dir .ragas-state
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload durable state and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluation-state
          path: .ragas-state/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload frozen reference provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-reference-provenance
          path: |
            .cache/ragas-review/ragas20_reference_candidates.json
            .cache/ragas-review/ragas20_review_evidence.json
          if-no-files-found: warn
          retention-days: 30
