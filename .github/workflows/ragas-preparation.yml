name: RAGAS offline preparation

on:
  push:
    branches: [eval/ragas-preparation]
  pull_request:
    paths:
      - 'scripts/*ragas*'
      - 'tests/test_ragas*'
      - 'docs/ragas_evaluation_plan.md'
      - 'data/eval/ragas20_reference_drafts.json'
      - '.github/workflows/ragas-preparation.yml'

permissions:
  contents: read

concurrency:
  group: ragas-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAGAS_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /docs/ragas_evaluation_plan.md
            /data/eval/golden_questions.json
            /data/eval/ragas20_reference_drafts.json
            /data/index/chroma.sqlite3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Unit tests without third-party packages
        run: python -m unittest discover -s tests -p test_ragas_preparation.py -v
      - name: Prepare real gold evidence using read-only SQLite
        run: |
          python scripts/prepare_ragas.py
          python scripts/prepare_ragas.py --prepare-review
      - name: Confirm missing references block readiness and database is unchanged
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          path = pathlib.Path('.cache/ragas-review/ragas20_reference_review.json')
          packet = json.loads(path.read_text())
          assert len(packet['questions']) == 20
          assert packet['scores'] is None
          assert packet['api_calls_performed'] == 0
          result = subprocess.run([sys.executable, 'scripts/prepare_ragas.py', '--check-reviewed', str(path)])
          assert result.returncode == 2, 'Unreviewed references must not be evaluation-ready'
          subprocess.run(['git', 'diff', '--exit-code', '--', 'data/index/chroma.sqlite3', 'data/eval/golden_questions.json'], check=True)
          print('REAL_GOLD_EVIDENCE_EXPORT=PASSED')
          print('UNREVIEWED_REFERENCES_BLOCKED=PASSED')
          print('READ_ONLY_INDEX_CHECK=PASSED')
          print('COHERE_CALLS=0; MODEL_INFERENCE=NOT_RUN; RAGAS_SCORES=NOT_RUN')
          print('SELECTED_IDS=' + ','.join(q['id'] for q in packet['questions']))
          print('GOLD_EVIDENCE_COUNT=' + str(sum(len(q['gold_evidence']) for q in packet['questions'])))
          PY
      - name: Validate draft provenance and keep human approval pending
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('.cache/ragas-review')
          packet = json.loads((root / 'ragas20_reference_review.json').read_text())
          source = pathlib.Path('data/eval/ragas20_reference_drafts.json')
          drafts = json.loads(source.read_text())
          for field in ('golden_git_blob', 'golden_semantic_sha256', 'index_sha256', 'selection_seed'):
              assert drafts[field] == packet[field], 'Draft provenance mismatch: ' + field
          assert drafts['status'] == 'ai_assisted_drafts_pending_human_review'
          assert drafts['reviewed_by'] is None
          assert drafts['cohere_calls'] == 0 and drafts['ragas_scores'] is None
          assert len(drafts['questions']) == 20
          assert [q['id'] for q in drafts['questions']] == [q['id'] for q in packet['questions']]
          for draft, row in zip(drafts['questions'], packet['questions']):
              assert draft['supporting_chunk_ids'] == row['gold_chunk_ids']
              assert isinstance(draft['reference_draft'], str) and draft['reference_draft'].strip()
              assert draft['review_status'] == 'pending'
          shutil.copy2(source, root / source.name)
          print('REFERENCE_DRAFT_STRUCTURE_AND_PROVENANCE=20/20')
          print('HUMAN_APPROVAL=NOT_CLAIMED; SEMANTIC_REVIEW=PENDING')
          print('API_CALLS=0; RAGAS_SCORES=NOT_RUN')
          PY
      - name: Export original-source context for reference coverage review
        run: |
          python scripts/export_ragas_reference_context.py
          python - <<'PY'
          import pathlib, shutil
          root = pathlib.Path('.cache/ragas-review')
          shutil.copy2('.cache/ragas-reference-context.json', root / 'ragas-reference-context.json')
          for name in ['scripts/prepare_ragas.py','scripts/export_ragas_reference_context.py','tests/test_ragas_preparation.py','docs/ragas_evaluation_plan.md','data/eval/golden_questions.json','data/eval/ragas20_reference_drafts.json','.github/workflows/ragas-preparation.yml']:
              target = root / 'source_inputs' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(name, target)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ragas20-reference-review
          path: .cache/ragas-review/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
